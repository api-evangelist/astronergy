aid: astronergy
name: Astronergy
description: 'Astronergy (Chint New Energy Technology Co., Ltd.) is the photovoltaic
  cell and module manufacturing arm of China''s CHINT Group. Founded in 2006, it is
  one of the earliest private Chinese enterprises in the PV sector and is ranked among
  the world''s largest module suppliers. It designs, manufactures and sells high-efficiency
  crystalline-silicon PV cells and modules — notably the n-type TOPCon ASTRO N series
  in bifacial and monofacial form — for utility-scale power stations, commercial and
  industrial rooftops, and residential systems. Astronergy sells into more than 140
  countries and regions and operates manufacturing bases and sales centers in markets
  including Germany, Spain, the USA, Brazil and Turkey. Its public web surface is a
  marketing and product-download site: datasheets, installation manuals, warranty and
  certification PDFs, a module-authenticity checker and a PV Planner yield calculator.
  It publishes no developer program, API documentation or machine-readable API contract.'
